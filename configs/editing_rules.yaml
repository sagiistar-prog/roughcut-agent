version: 2
project: RoughCut Agent

editing_principles:
  rhythm:
    description: "剪辑要有节奏，不要机械拼接。"
    rules:
      - "避免把两句话硬贴在一起。"
      - "相邻片段之间如果语气变化大，需要保留呼吸空间。"
      - "优先选择表达完整、起承转合清楚的片段。"

  breathing_room:
    description: "剪切点要给人声留气口。"
    rules:
      - "裁切起点尽量不要正好卡在人声开始处。"
      - "默认把 start_time 向前延伸 0.4 到 0.6 秒。"
      - "如果前方有杂音或其他人声，则不强行前延。"
      - "裁切终点默认向后延伸 0.2 到 0.4 秒，避免句尾被切断。"

  continuity:
    description: "保证语义连续。"
    rules:
      - "不要把两个语义不连续的句子直接拼接。"
      - "如果片段之间缺少承接，需要在 risk_note 中标记。"
      - "优先保持同一主题片段内部连续。"

  quality:
    description: "保证基础可看性。"
    rules:
      - "跳过明显空白、跑题、重复、音量过低、画面严重晃动的片段。"
      - "识别文字不确定时不要强行判断，要标记人工复核。"

selection:
  ordering: source_order
  unmeasured_scores: unknown
  preserve_complete_segment: true
  overlapping_source_policy: keep_first_report_rest
  limit_padding_to_neighbor_boundaries: true
  human_review_required_for:
    - semantic_continuity
    - audio_visual_quality
    - relevance

pacing:
  target_total_seconds: 180
  max_clip_count: 13
  preferred_clip_seconds:
    min: 4
    max: 22
  preferred_length_is_soft_review_threshold: true

cut_padding:
  start_pre_roll_seconds: 0.5
  start_pre_roll_range_seconds:
    min: 0.4
    max: 0.6
  end_post_roll_seconds: 0.3
  end_post_roll_range_seconds:
    min: 0.2
    max: 0.4
  do_not_force_pre_roll_when:
    - noise_before
    - overlap_speech_before
    - unrelated_before
  clamp_to_video_bounds: true

semantic_rules:
  require_continuity: true
  write_risk_note_on_logic_jump: true
  avoid_hard_join_without_transition: true

subtitles:
  enabled: false
  opt_in: captions_from_asr_report
  output: sidecar_srt_and_vtt
  timing: source_words_mapped_to_measured_rendered_segments
  partial_word_policy: omit_and_report
  missing_word_timing_policy: leave_gap_and_report
  max_cue_characters: 42
  max_cue_seconds: 4.0
  max_word_gap_seconds: 0.75
  require_source_hash_match: true
  review_status: needs_review
  bilingual: false
  primary_language: zh
  secondary_language: en
  normalize_recognition_typos: true
  keep_original_transcript_for_review: true

transcript_replacements: {}

safety:
  never_delete_raw: true
  never_upload_raw: true
  ignore_quarantine_dir: raw_duplicates_quarantine
  require_timeline_before_render: true
  keep_intermediate_files: true

# Validation: reject non-finite, negative, reversed or out-of-media time ranges.
# The total duration budget also applies to the first clip.
# Tighter-pacing feedback updates both clip maximum fields consistently.

render_validation:
  require_explicit_review_acknowledgement: true
  normalize_video: "1280x720, 30 fps, yuv420p, letterbox"
  normalize_audio: "48000 Hz stereo; silent source receives silence"
  reject_partial_render: true
  reject_existing_outputs: true
  verify_source_duration_with_ffprobe: true
  restrict_outputs_to_output_directory: true
