name: RoughCut quality
on: [push, pull_request]
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-plugin.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tests -v
      - run: python scripts/plugin_run.py --input examples/plugin-input.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  asr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak
      - run: python -m pip install -r requirements-asr.txt
      - run: python scripts/create_acceptance_media.py --directory output/ci-asr
      - run: python scripts/stage1_transcribe_index.py --raw-dir output/ci-asr --output output/ci-asr/material_index.csv --model tiny.en --language en
      - run: python scripts/asr_acceptance.py --report output/ci-asr/material_index.asr.json --output output/ci-asr/acceptance.json
      - run: python scripts/caption_acceptance.py --asr output/ci-asr/material_index.asr.json --output-dir output/ci-captions
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-asr-report
          path: |
            output/ci-asr/acceptance.json
            output/ci-captions/acceptance.json
